# Project-wide Gradle settings.
# JVM args: keep the daemon lean but give the Kotlin/AGP toolchain headroom.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
# Configuration cache is left OFF: the OpenAPI generator task (used to codegen
# the backend client from the vendored spec) is not yet configuration-cache safe.

# AndroidX is required by modern AGP.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Non-transitive R classes keep per-module resource footprint tight (footprint budget).
android.nonTransitiveRClass=true
